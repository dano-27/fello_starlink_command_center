<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audit Log - Fello Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F5F5F5;
      --border: rgba(0,0,0,0.08);
      --primary: #3166AE;
      --text: #232428;
      --muted: #636363;
      --green: #05AC3F;
      --red: #FF4D41;
      --amber: #F59231;
      --font: 'Montserrat', sans-serif;
      --radius: 20px;
    }
    body {
      margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh;
    }
    .header {
      background: var(--bg); border-bottom: 1px solid var(--border); padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
    }
    .header-brand {
      display: flex; align-items: center; gap: 16px; text-decoration: none; color: var(--text);
    }
    .logo { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
    .divider { width: 1px; height: 20px; background: var(--border); }
    .title { font-size: 16px; font-weight: 600; }
    .subtitle { font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 400; }
    
    .container { padding: 32px; max-width: 1400px; margin: 0 auto; }
    
    .filters {
      background: var(--surface); padding: 16px; border-radius: 12px; border: 1px solid var(--border);
      display: flex; gap: 16px; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap;
    }
    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-group label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; }
    .filter-input {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: var(--font); font-size: 13px; outline: none; background: var(--bg);
    }
    .filter-input:focus { border-color: var(--primary); }
    
    .btn {
      padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: var(--font);
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    
    .table-container {
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: var(--surface); padding: 12px 16px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); color: var(--text); }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(0,0,0,0.02); }
    
    .badge {
      padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    }
    .badge-post { background: rgba(49,102,174,0.1); color: var(--primary); }
    .badge-delete { background: rgba(255,77,65,0.1); color: var(--red); }
    .badge-login { background: rgba(5,172,63,0.1); color: var(--green); }
    .badge-logout { background: rgba(245,146,49,0.1); color: var(--amber); }
    .badge-view { background: rgba(139,92,246,0.1); color: #8b5cf6; }
    .badge-other { background: var(--surface); color: var(--muted); }
    
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--surface); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
    .tab { padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: var(--font); background: none; color: var(--muted); transition: all 0.2s; }
    .tab.active { background: var(--primary); color: white; }
    .tab:hover:not(.active) { background: rgba(0,0,0,0.04); color: var(--text); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    
    .session-card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
    .session-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.15s; }
    .session-header:hover { background: var(--surface); }
    .session-user { font-weight: 700; font-size: 15px; }
    .session-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .session-stats { display: flex; gap: 16px; align-items: center; }
    .session-stat { text-align: center; }
    .session-stat-value { font-size: 18px; font-weight: 700; color: var(--primary); }
    .session-stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .session-body { display: none; border-top: 1px solid var(--border); padding: 16px 20px; }
    .session-card.expanded .session-body { display: block; }
    
    .task-item { display: flex; gap: 16px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .task-item:last-child { border-bottom: none; }
    .task-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--primary); margin-top: 4px; flex-shrink: 0; }
    .task-info { flex: 1; }
    .task-order { font-weight: 700; font-size: 14px; }
    .task-time { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .task-actions { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
    .task-duration { font-weight: 700; font-size: 14px; color: var(--primary); white-space: nowrap; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .stat-card-value { font-size: 28px; font-weight: 700; color: var(--text); }
    .stat-card-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
    
    .details {
      max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-family: monospace; font-size: 12px; color: var(--muted);
    }
    .details.expanded { white-space: pre-wrap; word-break: break-all; background: var(--surface); padding: 8px; border-radius: 6px; }
    
    .ai-summary-btn {
      padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
      border: 1px solid rgba(49,102,174,0.3); background: rgba(49,102,174,0.06); color: var(--primary);
      font-family: var(--font); transition: all 0.2s; white-space: nowrap;
    }
    .ai-summary-btn:hover { background: rgba(49,102,174,0.12); border-color: var(--primary); }
    .ai-summary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ai-summary-box {
      margin-top: 12px; padding: 14px 18px; background: linear-gradient(135deg, rgba(49,102,174,0.04), rgba(49,102,174,0.08));
      border: 1px solid rgba(49,102,174,0.15); border-radius: 10px; font-size: 13px; line-height: 1.6; color: var(--text);
    }
    .ai-summary-box .ai-label { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .ai-summary-loading { color: var(--muted); font-style: italic; }
    
    .empty-state { padding: 48px; text-align: center; color: var(--muted); font-size: 14px; }
    
    .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .auto-refresh { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  </style>
  <link rel="stylesheet" href="/shared-header.css">
</head>
<body>
  <header class="fello-header"></header>
  <script src="/shared-header.js"></script>

  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('log')">📋 Audit Log</button>
      <button class="tab" onclick="switchTab('sessions')">🕐 Sessions</button>
      <button class="tab" onclick="switchTab('stats')">📊 Agent Stats</button>
    </div>

    <div id="panel-log" class="tab-panel active">
    <div class="filters">
      <div class="filter-group">
        <label>User</label>
        <select id="f-user" class="filter-input"><option value="">All Users</option></select>
      </div>
      <div class="filter-group">
        <label>Action</label>
        <select id="f-action" class="filter-input">
          <option value="">All Actions</option>
          <option value="LOGIN">LOGIN</option>
          <option value="LOGOUT">LOGOUT</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
          <option value="PATCH">PATCH</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Search</label>
        <input type="text" id="f-search" class="filter-input" placeholder="Search path or details...">
      </div>
      <div class="filter-group">
        <label>Start Date</label>
        <input type="date" id="f-start" class="filter-input">
      </div>
      <div class="filter-group">
        <label>End Date</label>
        <input type="date" id="f-end" class="filter-input">
      </div>
      <button class="btn btn-primary" onclick="loadData()">Filter</button>
      <button class="btn btn-outline" style="margin-left:auto" onclick="exportCsv()">Export CSV</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>User</th>
            <th>Action</th>
            <th>Path</th>
            <th>Details</th>
            <th>IP</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="6" class="empty-state">Loading audit entries...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="footer-bar">
      <div class="auto-refresh">
        <input type="checkbox" id="auto-refresh" checked>
        <label for="auto-refresh">Auto-refresh (30s)</label>
        <span id="last-updated" style="margin-left:16px;font-size:11px;"></span>
      </div>
      <button class="btn btn-outline" onclick="loadMore()" id="load-more">Load More</button>
    </div>
    </div>
    </div><!-- end panel-log -->

    <div id="panel-sessions" class="tab-panel">
      <div class="filters">
        <div class="filter-group">
          <label>Agent</label>
          <select id="s-user" class="filter-input"><option value="">All Agents</option></select>
        </div>
        <div class="filter-group">
          <label>From</label>
          <input type="date" id="s-from" class="filter-input">
        </div>
        <div class="filter-group">
          <label>To</label>
          <input type="date" id="s-to" class="filter-input">
        </div>
        <button class="btn btn-primary" onclick="loadSessions()">Load Sessions</button>
      </div>
      <div id="sessions-container"></div>
    </div>

    <div id="panel-stats" class="tab-panel">
      <div class="stats-grid" id="stats-grid"></div>
      <div id="stats-table-container"></div>
    </div>
  </div>

  <script>
    let offset = 0;
    const limit = 100;
    let autoRefreshInterval;

    function getBadgeClass(method) {
      if(method === 'POST') return 'badge-post';
      if(method === 'DELETE') return 'badge-delete';
      if(method === 'LOGIN') return 'badge-login';
      if(method === 'LOGOUT') return 'badge-logout';
      if(method === 'VIEW') return 'badge-view';
      return 'badge-other';
    }

    function formatDate(iso) {
      var d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function formatTime(iso) {
      if (!iso) return '-';
      var d = new Date(iso);
      return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    // Tab switching
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
      document.getElementById('panel-' + tab).classList.add('active');
      event.target.classList.add('active');
      if (tab === 'sessions') loadSessions();
      if (tab === 'stats') loadStats();
    }

    // ── Audit Log Tab ──
    async function loadData(append) {
      if(!append) offset = 0;
      var u = document.getElementById('f-user').value;
      var a = document.getElementById('f-action').value;
      var s = document.getElementById('f-search').value;
      var query = new URLSearchParams({ limit: limit, offset: offset, user: u, method: a, search: s });
      try {
        var res = await fetch('/api/audit/log?' + query);
        var data = await res.json();
        var tb = document.getElementById('table-body');
        if(!append) tb.innerHTML = '';
        if(!data.entries || data.entries.length === 0) {
          if(!append) tb.innerHTML = '<tr><td colspan="7" class="empty-state">No audit entries found</td></tr>';
          document.getElementById('load-more').style.display = 'none';
        } else {
          data.entries.forEach(function(e) {
            var tr = document.createElement('tr');
            var detailText = e.body ? JSON.stringify(e.body) : '-';
            var statusBadge = e.status ? '<span style="font-size:11px;color:' + (e.status < 400 ? 'var(--green)' : 'var(--red)') + '">' + e.status + '</span>' : '';
            tr.innerHTML =
              '<td>' + formatDate(e.timestamp) + '</td>' +
              '<td style="font-weight:500">' + (e.user || '-') + '<br><span style="font-size:10px;color:var(--muted)">' + (e.role || '') + '</span></td>' +
              '<td><span class="badge ' + getBadgeClass(e.method) + '">' + (e.method || '-') + '</span> ' + statusBadge + '</td>' +
              '<td style="font-family:monospace;font-size:12px">' + (e.path || '-') + '</td>' +
              '<td><div class="details" onclick="this.classList.toggle(\'expanded\')" title="Click to expand">' + detailText + '</div></td>' +
              '<td style="color:var(--muted);font-size:11px">' + (e.ip || '-') + '</td>';
            tb.appendChild(tr);
          });
          document.getElementById('load-more').style.display = data.entries.length < limit ? 'none' : 'block';
        }
        document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
        populateUsers(data.entries);
      } catch(e) { console.error(e); }
    }

    function populateUsers(entries) {
      var selects = [document.getElementById('f-user'), document.getElementById('s-user')];
      selects.forEach(function(select) {
        if (!select) return;
        var existing = new Set([].map.call(select.options, function(o) { return o.value; }));
        entries.forEach(function(e) {
          if(e.user && !existing.has(e.user)) {
            existing.add(e.user);
            var opt = document.createElement('option');
            opt.value = e.user;
            opt.textContent = e.user;
            select.appendChild(opt);
          }
        });
      });
    }

    function loadMore() { offset += limit; loadData(true); }
    function exportCsv() { window.location.href = '/api/audit/log/export'; }

    document.getElementById('auto-refresh').addEventListener('change', function(e) {
      if(e.target.checked) { autoRefreshInterval = setInterval(function() { loadData(); }, 30000); }
      else { clearInterval(autoRefreshInterval); }
    });

    // ── Sessions Tab ──
    async function loadSessions() {
      var container = document.getElementById('sessions-container');
      container.innerHTML = '<div class="empty-state">Loading sessions...</div>';
      var u = document.getElementById('s-user').value;
      var from = document.getElementById('s-from').value;
      var to = document.getElementById('s-to').value;
      var params = new URLSearchParams({ limit: 30 });
      if (u) params.set('user', u);
      if (from) params.set('from', from);
      if (to) params.set('to', to);

      try {
        var res = await fetch('/api/audit/sessions?' + params);
        var data = await res.json();
        container.innerHTML = '';

        if (!data.sessions || data.sessions.length === 0) {
          container.innerHTML = '<div class="empty-state">No sessions found for this period</div>';
          return;
        }

        // Populate user dropdown
        var userSet = new Set();
        data.sessions.forEach(function(s) { userSet.add(s.user); });
        var select = document.getElementById('s-user');
        var existing = new Set([].map.call(select.options, function(o) { return o.value; }));
        userSet.forEach(function(u) {
          if (!existing.has(u)) {
            var opt = document.createElement('option');
            opt.value = u; opt.textContent = u;
            select.appendChild(opt);
          }
        });

        data.sessions.forEach(function(session, idx) {
          var card = document.createElement('div');
          card.className = 'session-card';
          card.dataset.sessionIdx = idx;

          var tasksHtml = '';
          (session.tasks || []).forEach(function(task) {
            var actionBadges = (task.actions || []).slice(0, 8).map(function(a) {
              return '<span class="badge ' + getBadgeClass(a.method) + '" style="font-size:10px;padding:2px 5px;">' + a.method + ' ' + (a.path || '').split('/').pop() + '</span>';
            }).join('');
            if (task.actions && task.actions.length > 8) actionBadges += '<span style="font-size:10px;color:var(--muted)">+' + (task.actions.length - 8) + ' more</span>';

            tasksHtml +=
              '<div class="task-item">' +
                '<div class="task-dot"></div>' +
                '<div class="task-info">' +
                  '<div class="task-order">' + (task.orderId || 'General') + '</div>' +
                  '<div class="task-time">' + formatTime(task.startTime) + ' → ' + formatTime(task.endTime) + ' &bull; ' + (task.actionCount || 0) + ' actions</div>' +
                  '<div class="task-actions">' + actionBadges + '</div>' +
                '</div>' +
                '<div class="task-duration">' + (task.durationFormatted || '-') + '</div>' +
              '</div>';
          });

          card.innerHTML =
            '<div class="session-header">' +
              '<div>' +
                '<div class="session-user">' + (session.name || session.user) + ' <span style="font-weight:400;font-size:12px;color:var(--muted)">(' + session.user + ')</span></div>' +
                '<div class="session-meta">' +
                  formatDate(session.loginTime || '') + (session.logoutTime ? ' → ' + formatTime(session.logoutTime) : ' (active)') +
                  ' &bull; ' + session.durationFormatted +
                  ' &bull; IP: ' + (session.ip || '-') +
                '</div>' +
              '</div>' +
              '<div class="session-stats">' +
                '<div class="session-stat"><div class="session-stat-value">' + (session.taskCount || 0) + '</div><div class="session-stat-label">Tasks</div></div>' +
                '<div class="session-stat"><div class="session-stat-value">' + (session.totalActions || 0) + '</div><div class="session-stat-label">Actions</div></div>' +
                '<button class="ai-summary-btn" onclick="event.stopPropagation(); getAiSummary(this, ' + idx + ')" title="Get AI-powered session summary">✨ AI Summary</button>' +
              '</div>' +
            '</div>' +
            '<div class="session-body">' +
              '<div class="ai-summary-container" id="ai-summary-' + idx + '"></div>' +
              (tasksHtml || '<div class="empty-state" style="padding:16px">No task activity recorded</div>') +
            '</div>';

          card.querySelector('.session-header').addEventListener('click', function() { card.classList.toggle('expanded'); });
          container.appendChild(card);

          // Store session data for AI summarization
          card._sessionData = session;
        });
      } catch(e) {
        container.innerHTML = '<div class="empty-state" style="color:var(--red)">Error loading sessions: ' + e.message + '</div>';
      }
    }

    // ── AI Session Summary ──
    async function getAiSummary(btn, idx) {
      var card = btn.closest('.session-card');
      var session = card._sessionData;
      var container = document.getElementById('ai-summary-' + idx);

      if (!session) { alert('No session data available'); return; }

      // Expand the card to show the summary
      card.classList.add('expanded');

      // If already summarized, toggle visibility
      if (container.dataset.loaded === 'true') {
        container.style.display = container.style.display === 'none' ? 'block' : 'none';
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ Analyzing...';
      container.innerHTML = '<div class="ai-summary-box"><div class="ai-label">✨ AI Analysis</div><div class="ai-summary-loading">Analyzing session activity...</div></div>';

      try {
        var res = await fetch('/api/audit/sessions/summarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(session)
        });
        var data = await res.json();

        if (data.error) throw new Error(data.error);

        container.innerHTML = '<div class="ai-summary-box"><div class="ai-label">✨ AI Analysis</div><div>' + (data.summary || 'No summary generated').replace(/\n/g, '<br>') + '</div></div>';
        container.dataset.loaded = 'true';
        btn.textContent = '✨ AI Summary';
        btn.disabled = false;
      } catch(e) {
        container.innerHTML = '<div class="ai-summary-box" style="border-color:var(--red)"><div class="ai-label" style="color:var(--red)">Error</div>' + e.message + '</div>';
        btn.textContent = '✨ Retry';
        btn.disabled = false;
      }
    }

    // ── Agent Stats Tab ──
    async function loadStats() {
      try {
        var res = await fetch('/api/audit/agent-stats');
        var data = await res.json();
        var grid = document.getElementById('stats-grid');
        var tableContainer = document.getElementById('stats-table-container');

        if (!data.agents || data.agents.length === 0) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No agent data yet</div>';
          return;
        }

        var totalActions = 0, totalLogins = 0, totalLookups = 0;
        data.agents.forEach(function(a) { totalActions += a.totalActions; totalLogins += a.logins; totalLookups += a.lookups; });

        grid.innerHTML =
          '<div class="stat-card"><div class="stat-card-value">' + data.agents.length + '</div><div class="stat-card-label">Active Agents</div></div>' +
          '<div class="stat-card"><div class="stat-card-value">' + totalActions + '</div><div class="stat-card-label">Total Actions</div></div>' +
          '<div class="stat-card"><div class="stat-card-value">' + totalLogins + '</div><div class="stat-card-label">Total Logins</div></div>' +
          '<div class="stat-card"><div class="stat-card-value">' + totalLookups + '</div><div class="stat-card-label">Order Lookups</div></div>';

        var rows = data.agents.map(function(a) {
          return '<tr>' +
            '<td style="font-weight:600">' + a.user + '</td>' +
            '<td>' + (a.name || '-') + '</td>' +
            '<td>' + (a.role || '-') + '</td>' +
            '<td style="font-weight:700;color:var(--primary)">' + a.totalActions + '</td>' +
            '<td>' + a.logins + '</td>' +
            '<td>' + a.lookups + '</td>' +
            '<td>' + a.writes + '</td>' +
            '<td>' + a.activeDays + '</td>' +
            '<td>' + a.avgActionsPerDay + '</td>' +
            '<td style="font-size:11px;color:var(--muted)">' + formatDate(a.lastSeen) + '</td>' +
          '</tr>';
        }).join('');

        tableContainer.innerHTML =
          '<div class="table-container"><table>' +
            '<thead><tr>' +
              '<th>Username</th><th>Name</th><th>Role</th><th>Total Actions</th><th>Logins</th><th>Lookups</th><th>Writes</th><th>Active Days</th><th>Avg/Day</th><th>Last Seen</th>' +
            '</tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table></div>';
      } catch(e) {
        document.getElementById('stats-grid').innerHTML = '<div class="empty-state" style="color:var(--red);grid-column:1/-1">Error: ' + e.message + '</div>';
      }
    }

    // Initial load
    loadData();
    autoRefreshInterval = setInterval(function() { loadData(); }, 30000);

    // User Badge script
    fetch("/api/auth/me").then(function(r){return r.json()}).then(function(u){
      var b=document.getElementById("user-badge");
      if(b&&u.username){
        var signOutBtn=document.createElement("button");
        signOutBtn.textContent="Sign Out";
        signOutBtn.style.cssText="background:none;border:1px solid rgba(0,0,0,0.1);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:#636363;";
        signOutBtn.addEventListener("click",function(){fetch("/api/auth/logout",{method:"POST"}).then(function(){location.href="/login"})});
        var nameSpan=document.createElement("span");
        nameSpan.style.color="#636363";
        nameSpan.textContent=u.name;
        b.appendChild(nameSpan);
        b.appendChild(signOutBtn);
      }
    }).catch(function(){});
  </script>
</body>
</html>
