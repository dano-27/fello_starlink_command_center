<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fello Command Center</title>
  <meta name="description" content="Fello Command Center — Centralized fleet management for iPads, SIMs, and connectivity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="https://events.fello.com/favicon.ico">
  <meta name="theme-color" content="#232428">
</head>
<body>
  
  <header class="header">
    <div class="header-top">
      <div class="header-brand">
        <a href="/lookup/" class="brand-link">
          <span class="brand-wordmark">fello</span>
          <span class="brand-divider"></span>
          <span class="brand-chip">Command Center</span>
        </a>
      </div>
      <div class="tools-nav">
        <button class="tools-toggle" id="tools-toggle">🧰 Tools <span class="tools-chevron">▼</span></button>
        <div class="tools-dropdown" id="tools-dropdown">
          <a href="/checker/" class="tools-link"><span>🛰️</span> Site Checker</a>
          <a href="/simplemdm/" class="tools-link"><span>📱</span> SimpleMDM</a>
          <a href="/webbing/" class="tools-link"><span>📶</span> Webbing IoT</a>
          <a href="/starlink/" class="tools-link"><span>📡</span> Starlink</a>
          <a href="/hexnode/" class="tools-link"><span>🔒</span> Hexnode UEM</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="search-container">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="e.g. FE13916 or WW13725786" autocomplete="off" autofocus>
        <div class="spinner" id="search-spinner"></div>
        <button id="search-btn" class="search-btn">Search</button>
      </div>
    </div>

    <div id="results-container" class="results-container">
      <!-- Dynamic Content Will Be Injected Here -->
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <!-- Device Detail Drawer -->
  <div class="drawer-overlay" id="drawer-overlay">
    <div class="drawer" id="device-drawer">
      <div class="drawer-header">
        <h2 id="drawer-title">Device Details</h2>
        <button class="drawer-close" id="drawer-close">&times;</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </div>

  <!-- Screen Share Overlay -->
  <div class="screen-overlay" id="screen-overlay" style="display:none;">
    <iframe id="screen-iframe" src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
    <button class="screen-overlay-close" id="screen-close">✕ End Screen Share</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
