<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Fello Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F5F5F5;
      --border: rgba(0,0,0,0.08);
      --primary: #3166AE;
      --text: #232428;
      --muted: #636363;
      --red: #FF4D41;
      --font: 'Montserrat', sans-serif;
      --radius: 20px;
    }
    body {
      margin: 0; font-family: var(--font); background: var(--surface); color: var(--text);
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-card {
      background: var(--bg); padding: 48px; border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0; transform: translateY(20px);
    }
    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-container {
      text-align: center; margin-bottom: 32px;
    }
    .logo {
      font-size: 32px; font-weight: 800; color: var(--primary); letter-spacing: -1px; margin: 0;
    }
    .subtitle {
      font-size: 14px; color: var(--muted); font-weight: 500; margin-top: 4px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-input {
      width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px;
      font-family: var(--font); font-size: 15px; color: var(--text); box-sizing: border-box; transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none; border-color: var(--primary);
    }
    .btn {
      width: 100%; background: var(--primary); color: white; border: none; padding: 14px;
      border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: var(--font); margin-top: 8px;
    }
    .btn:hover { background: #2856a0; }
    .error {
      color: var(--red); font-size: 13px; font-weight: 500; margin-top: 12px; text-align: center; display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-container">
      <img src="/fello-logo.png" alt="Fello" style="height:48px;margin-bottom:8px;">
      <div class="subtitle">Command Center</div>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" class="form-input" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-input" required>
      </div>
      <button type="submit" class="btn">Sign In</button>
      <div id="error-msg" class="error">Invalid username or password</div>
    </form>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const err = document.getElementById('error-msg');
      err.style.display = 'none';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        if (res.ok) {
          window.location.href = '/lookup/';
        } else {
          err.style.display = 'block';
        }
      } catch (e) {
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
